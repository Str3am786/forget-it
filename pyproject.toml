[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgetit"
version = "1.0.0a0"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Miguel Arroyo" }]

dependencies = [
    "falkordb",
    "langgraph",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "letta-client",
    "humanize", # Decide to keep or not
    "pandas",
    "numpy",     # core: embeddings/similarity, runner query_coverage
    "pyyaml",    # core-adjacent: golden corpora tooling + tests
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev  = ["pytest>=8.0", "ruff", "mypy"]
# everything the offline analysis / E3 analyzer / figures need
analysis = ["scipy", "matplotlib"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["forgetit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
