[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgetit"
version = "1.0.0a0"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Miguel Arroyo" }]

dependencies = [
    "falkordb",
    "langgraph",
    "openai>=1.0.0",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
    "letta-client",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
figures = [
    "matplotlib>=3.8",
    "scipy>=1.11",
]
test = ["pytest>=8.0", "pyyaml>=6.0"]
dev  = ["ruff", "mypy", "forgetit[figures,test]"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["forgetit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
