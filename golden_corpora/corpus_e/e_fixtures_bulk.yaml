- id: e028
  class: fifo
  verified: false
  assumptions:
  - FIFO first-class
  - eviction order == insertion order, touches ignored
  input:
    policy: fifo
    budget: 140
    events:
    - op: insert
      item: A
      size: 40
    - op: insert
      item: B
      size: 40
    - op: insert
      item: C
      size: 40
    - op: touch
      item: A
    - op: insert
      item: D
      size: 40
    - op: insert
      item: E
      size: 40
  expected:
    evictions:
    - A
    - B
    compressions: []
    resident:
    - C
    - D
    - E
    resident_bytes:
      C: 40
      D: 40
      E: 40
  rationale: "FIFO evicts in insertion order ['A', 'B'] even though A was touched (LRU would evict ['B',\
    \ 'C']) \u2014 touch-ignoring is the class logic, keyed on the store's insert ordinal, not data timestamps."
