- id: e025
  class: lfu_freq
  verified: false
  assumptions:
  - freq counts touches only
  - "incoming item EXEMPT from eviction (implementation semantics \u2014 QUESTIONS.md Q1)"
  input:
    policy: lfu
    budget: 100
    events:
    - op: insert
      item: A
      size: 40
    - op: insert
      item: B
      size: 40
    - &id001
      op: touch
      item: A
    - *id001
    - *id001
    - op: touch
      item: B
    - op: insert
      item: C
      size: 40
  expected:
    evictions:
    - B
    compressions: []
    resident:
    - A
    - C
    resident_bytes:
      A: 40
      C: 40
  rationale: "Freqs at C's insert: A high, B=1; LFU evicts ['B'] while LRU would evict ['A'] \u2014 frequency\
    \ (not recency) is the class logic. Incoming item C is EXEMPT (budget loop precedes its admit; Q1)."
