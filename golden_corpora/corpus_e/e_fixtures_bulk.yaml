- id: e033
  class: size_policy_arith
  verified: false
  assumptions:
  - keep_smallest victim rule
  - fixture is incoming-eligibility-robust by construction
  input:
    policy: keep_smallest
    budget: 110
    events:
    - op: insert
      item: A
      size: 20
    - op: insert
      item: B
      size: 60
    - op: insert
      item: C
      size: 35
  expected:
    evictions:
    - B
    compressions: []
    resident:
    - A
    - C
    resident_bytes:
      A: 20
      C: 35
  rationale: "keep_smallest: victim at pressure is the largest resident of sizes [20, 60] \u2192 ['B'];\
    \ incoming C (35B) is mid-sized so eligibility semantics cannot change the answer."
